name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., v0.8.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Update Cargo.toml version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore: bump version to ${VERSION}"
          git tag "${{ steps.get_version.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.get_version.outputs.tag }}"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          release_name: Release ${{ steps.get_version.outputs.tag }}
          body: |
            ## Changes in ${{ steps.get_version.outputs.tag }}

            ### Downloads
            - **Windows (x86_64)**: `thumbs-collage-${{ steps.get_version.outputs.version }}-windows-x86_64.zip`
            - **Linux (x86_64)**: `thumbs-collage-${{ steps.get_version.outputs.version }}-linux-x86_64.tar.gz`
            - **macOS (x86_64)**: `thumbs-collage-${{ steps.get_version.outputs.version }}-macos-x86_64.tar.gz`
            - **macOS (aarch64)**: `thumbs-collage-${{ steps.get_version.outputs.version }}-macos-aarch64.tar.gz`

            ### Installation
            1. Download the appropriate archive for your platform
            2. Extract the archive
            3. Ensure FFmpeg 8.0+ is installed on your system
            4. Run the binary: `./thumbs-collage --help`

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
          draft: false
          prerelease: false

  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download and setup FFmpeg
        run: |
          # Download FFmpeg 8.0 shared build
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "."
          $ffmpegDir = Get-ChildItem -Directory -Filter "ffmpeg-*" | Select-Object -First 1
          $env:FFMPEG_DIR = $ffmpegDir.FullName
          echo "FFMPEG_DIR=$($ffmpegDir.FullName)" >> $env:GITHUB_ENV
          echo "PATH=$($ffmpegDir.FullName)\bin;$env:PATH" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}"
          $ARCHIVE = "thumbs-collage-${VERSION}-windows-x86_64"
          New-Item -ItemType Directory -Path $ARCHIVE
          Copy-Item "target\x86_64-pc-windows-msvc\release\thumbs-collage.exe" "$ARCHIVE\"
          Copy-Item "README.md" "$ARCHIVE\"

          # Copy FFmpeg DLLs
          $ffmpegDir = Get-ChildItem -Directory -Filter "ffmpeg-*" | Select-Object -First 1
          Copy-Item "$($ffmpegDir.FullName)\bin\*.dll" "$ARCHIVE\"

          Compress-Archive -Path $ARCHIVE -DestinationPath "${ARCHIVE}.zip"

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./thumbs-collage-${{ needs.create-release.outputs.version }}-windows-x86_64.zip
          asset_name: thumbs-collage-${{ needs.create-release.outputs.version }}-windows-x86_64.zip
          asset_content_type: application/zip

  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install FFmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev \
            pkg-config

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          ARCHIVE="thumbs-collage-${VERSION}-linux-x86_64"
          mkdir -p "$ARCHIVE"
          cp "target/x86_64-unknown-linux-gnu/release/thumbs-collage" "$ARCHIVE/"
          cp "README.md" "$ARCHIVE/"
          tar -czf "${ARCHIVE}.tar.gz" "$ARCHIVE"

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./thumbs-collage-${{ needs.create-release.outputs.version }}-linux-x86_64.tar.gz
          asset_name: thumbs-collage-${{ needs.create-release.outputs.version }}-linux-x86_64.tar.gz
          asset_content_type: application/gzip

  build-macos:
    name: Build macOS
    needs: create-release
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install FFmpeg
        run: brew install ffmpeg pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCH="${TARGET%%-*}"
          ARCHIVE="thumbs-collage-${VERSION}-macos-${ARCH}"
          mkdir -p "$ARCHIVE"
          cp "target/${TARGET}/release/thumbs-collage" "$ARCHIVE/"
          cp "README.md" "$ARCHIVE/"
          tar -czf "${ARCHIVE}.tar.gz" "$ARCHIVE"

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./thumbs-collage-${{ needs.create-release.outputs.version }}-macos-${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'aarch64' }}.tar.gz
          asset_name: thumbs-collage-${{ needs.create-release.outputs.version }}-macos-${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'aarch64' }}.tar.gz
          asset_content_type: application/gzip
